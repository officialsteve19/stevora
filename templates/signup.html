<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stevora - Join Today</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background: linear-gradient(135deg,#feda75 0%,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5 100%);
  padding:20px;
}
.card{
  width:100%;max-width:380px;
  background:white;
  border-radius:24px;
  padding:32px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logo-icon{
  width:44px;height:44px;border-radius:12px;
  background: linear-gradient(135deg,#fa7e1e,#d62976,#962fbf);
  display:flex;align-items:center;justify-content:center;
  color:white;font-weight:800;font-size:24px;
}
.logo-text{font-size:28px;font-weight:800;letter-spacing:-0.5px}
h1{font-size:26px;font-weight:700;margin-bottom:8px}
.sub{color:#737373;font-size:14px;margin-bottom:24px}
label{font-size:14px;font-weight:500;margin-bottom:8px;display:block}
input{
  width:100%;padding:13px 14px;
  border:1.5px solid #dbdbdb;border-radius:12px;
  font-size:15px;outline:none;transition:0.2s;
  background:#fafafa;
}
input:focus{border-color:#000;background:#fff}
.field{margin-bottom:16px;position:relative}
.eye{position:absolute;right:12px;top:38px;cursor:pointer;opacity:0.5}
.btn-black{
  width:100%;padding:14px;background:#000;color:#fff;
  border:none;border-radius:12px;font-weight:600;font-size:15px;
  cursor:pointer;margin-top:8px;transition:0.2s;
}
.btn-black:hover{opacity:0.85;transform:translateY(-1px)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#737373;font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#dbdbdb}
.btn-google{
  width:100%;padding:13px;border:1.5px solid #dbdbdb;
  background:#fff;border-radius:12px;display:flex;
  align-items:center;justify-content:center;gap:10px;
  font-weight:500;cursor:pointer;transition:0.2s;
}
.btn-google:hover{background:#fafafa}
.login{ text-align:center;margin-top:22px;font-size:14px }
.login a{color:#962fbf;font-weight:600;text-decoration:none}
.terms{text-align:center;margin-top:16px;font-size:11px;color:#8e8e8e}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">S</div>
    <div class="logo-text">Stevora</div>
  </div>
  <h1>Create your account</h1>
  <p class="sub">Join Stevora. Start connecting today.</p>

  <form action="/signup" method="POST">
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <span class="eye">👁️</span>
    </div>
    <button class="btn-black" type="submit">Continue</button>
  </form>

  <div class="divider">or continue with</div>

  <button class="btn-google">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20">
    Continue with Google
  </button>

  <div class="login">Already have an account? <a href="/login">Log in</a></div>
  <div class="terms">By signing up you agree to our <a href="#">Terms</a> • Privacy Policy</div>
</div>
</body>
</html>
