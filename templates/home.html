<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box;font-family:Inter}
body{background:#fafafa}
.top{position:sticky;top:0;background:white;border-bottom:1px solid #dbdbdb;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px;background:linear-gradient(45deg,#feda75,#d62976,#962fbf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.icons{display:flex;gap:16px;font-size:20px}
.feed{max-width:470px;margin:0 auto}
.post{background:white;border:1px solid #dbdbdb;border-radius:8px;margin:12px 0}
.post-head{padding:12px;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(45deg,#fa7e1e,#d62976)}
.post-img{width:100%;height:380px;background:linear-gradient(135deg,#eee,#ccc);display:flex;align-items:center;justify-content:center;color:#999}
.actions{padding:12px;display:flex;gap:14px;font-size:22px}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dbdbdb;display:flex;justify-content:space-around;padding:10px;font-size:22px}
</style>
</head>
<body>
<div class="top"><div class="logo">Stevora</div><div class="icons">❤️ 💬</div></div>
<div class="feed">
  <div class="post">
    <div class="post-head"><div class="avatar"></div><b>stevora_official</b></div>
    <div class="post-img">Your posts will appear here</div>
    <div class="actions">❤️ 💬 ✈️</div>
  </div>
</div>
<div class="nav"><a href="/home">🏠</a><a href="/chat">💬</a><a href="/profile">👤</a></div>
</body>
</html>
