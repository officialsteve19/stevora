<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#fff;display:flex;flex-direction:column;height:100vh}
.top{padding:14px 16px;border-bottom:1px solid #dbdbdb;display:flex;align-items:center;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(45deg,#fa7e1e,#d62976)}
.name{font-weight:600}
.messages{flex:1;padding:16px;overflow-y:auto;background:#fafafa;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:70%;padding:10px 14px;border-radius:18px;font-size:14px}
.me{align-self:flex-end;background:linear-gradient(45deg,#962fbf,#d62976);color:white;border-bottom-right-radius:4px}
.them{align-self:flex-start;background:white;border:1px solid #dbdbdb;border-bottom-left-radius:4px}
.input-area{padding:12px;border-top:1px solid #dbdbdb;display:flex;gap:10px}
.input-area input{flex:1;padding:12px 16px;border:1px solid #dbdbdb;border-radius:24px;outline:none;background:#fafafa}
.input-area button{width:44px;height:44px;border-radius:50%;border:none;background:#000;color:white;font-size:18px;cursor:pointer}
.nav{position:fixed;bottom:60px;left:0;right:0;display:none}
@media(max-width:600px){.nav{display:flex;justify-content:space-around;padding:10px;background:white;border-top:1px solid #dbdbdb;position:fixed;bottom:0;left:0;right:0}}
</style>
</head>
<body>
<div class="top"><div class="avatar"></div><div class="name">Stevora Chat</div></div>
<div class="messages" id="msgs">
<div class="bubble them">Hey! Welcome to Stevora 👋</div>
<div class="bubble me">Thanks! This looks super cool 😍</div>
</div>
<div class="input-area">
<input id="msgInput" placeholder="Message...">
<button onclick="send()">↑</button>
</div>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const socket = io();
function send(){
let i=document.getElementById('msgInput'); if(!i.value)return;
let div=document.createElement('div'); div.className='bubble me'; div.textContent=i.value;
document.getElementById('msgs').appendChild(div); socket.emit('message',i.value); i.value='';
}
socket.on('message', m=>{
let div=document.createElement('div'); div.className='bubble them'; div.textContent=m;
document.getElementById('msgs').appendChild(div);
});
</script>
</body>
</html>
