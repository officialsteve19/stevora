<!DOCTYPE html>
<html><head><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title><script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script></head>
<body>
<div style="max-width:600px;margin:auto;background:white;height:100vh;display:flex;flex-direction:column">
<div style="padding:15px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between"><b>Stevora Chat</b><div><a href="/home">Home</a> | <a href="/logout">Logout</a></div></div>
<div id="messages" style="flex:1;overflow-y:auto;padding:15px">
{% for m in messages %}<p><b>{{ m['username'] }}:</b> {{ m['message'] }}</p>{% endfor %}
</div>
<div style="padding:10px;display:flex;gap:10px;border-top:1px solid #ddd"><input id="msg" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:20px" placeholder="Type a message..."><button onclick="send()" style="padding:10px 20px;border-radius:20px;border:none;background:black;color:white">Send</button></div>
</div>
<script>
var socket = io();
var username = "{{ username }}";
socket.on('message', data=>{
  document.getElementById('messages').innerHTML += `<p><b>${data.username}:</b> ${data.message}</p>`;
});
function send(){
  let input=document.getElementById('msg');
  if(input.value){socket.emit('message', input.value); input.value='';}
}
document.getElementById('msg').addEventListener('keypress', e=>{if(e.key==='Enter')send();});
</script>
</body></html>
