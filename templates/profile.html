<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#fff}
.top{padding:12px 16px;border-bottom:1px solid #dbdbdb;display:flex;justify-content:space-between;align-items:center}
.profile{max-width:935px;margin:0 auto;padding:24px 16px}
.head{display:flex;gap:28px;align-items:center}
.big-avatar{width:86px;height:86px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);padding:3px}
.big-avatar div{width:100%;height:100%;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.stats{display:flex;gap:20px;margin:16px 0}
.stats b{display:block;text-align:center}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;padding:7px;border-radius:8px;border:1px solid #dbdbdb;background:#efefef;font-weight:600;cursor:pointer}
.grid{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid div{aspect-ratio:1;background:#efefef;display:flex;align-items:center;justify-content:center;color:#999}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dbdbdb;display:flex;justify-content:space-around;padding:10px;font-size:22px}
</style>
</head>
<body>
<div class="top"><b>username</b><span>☰</span></div>
<div class="profile">
<div class="head">
<div class="big-avatar"><div>S</div></div>
<div>
<div class="stats"><span><b>0</b><br>posts</span><span><b>0</b><br>followers</span><span><b>0</b><br>following</span></div>
<div><b>Stevora User</b><br>Welcome to my Stevora ✨</div>
<div class="btns"><button>Edit profile</button><button>Share profile</button></div>
</div>
</div>
<div class="grid"><div>📸</div><div>📸</div><div>📸</div><div>📸</div><div>📸</div><div>📸</div></div>
</div>
<div class="nav"><a href="/home">🏠</a><a href="/chat">💬</a><a href="/profile">👤</a></div>
</body>
</html>
